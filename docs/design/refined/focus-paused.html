<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekagra — Focus (Paused)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-focus:#0A0B0E; --surface:#16181D; --surface-2:#111318; --surface-3:#1B1E24;
    --line:#23262E; --line-soft:#1D2028; --line-hi:#3A3F49;
    --t1:#ECEDEF; --t2:#B9BDC4; --t3:#8A8F98; --t4:#6B7078; --t5:#41454D;
    --ember:#F08A3E; --ember-hi:#FFB25E; --ember-dim:#7C5638; --green:#5BBF8A;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#07080A; font-family:'Manrope',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  .frame{
    width:390px; height:844px; margin:0 auto; position:relative; overflow:hidden;
    background:var(--bg-focus); color:var(--t1);
    display:flex; flex-direction:column; align-items:center;
  }
  .stage{position:relative; z-index:1; width:100%; display:flex; flex-direction:column; align-items:center;}

  .topbar{width:100%; padding:56px 20px 0; display:flex; align-items:center; justify-content:space-between;}
  .chev{width:40px; height:40px; border-radius:999px; background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--t2); cursor:pointer;
    transition:border-color .18s var(--ease), color .18s var(--ease), background .18s var(--ease);}
  .chev:hover{border-color:var(--line-hi); color:var(--t1); background:var(--surface-3);}
  .phase{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .paused-chip{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:6px 14px;}
  .paused-dot{width:6px; height:6px; border-radius:2px; background:var(--ember);}
  .overline{font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase;}
  .paused-txt{color:var(--ember);}
  .phase-sub{font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--t4);}
  .spacer{width:38px;}

  .ring-wrap{position:relative; width:312px; height:312px; margin-top:38px;}
  svg.ring{position:absolute; inset:0; transform:rotate(-90deg);}
  .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .time{font-size:86px; font-weight:800; letter-spacing:-3.2px; line-height:1; font-variant-numeric:tabular-nums; color:var(--t3);}
  .time-sub{margin-top:14px; color:var(--ember);}

  .task{margin-top:38px; width:100%; padding:0 40px; text-align:center;}
  .task-title{font-size:20px; font-weight:800; letter-spacing:-.2px; color:var(--t2);}
  .goalmark{display:inline-flex; align-items:center; gap:8px; margin-top:12px;}
  .tick{width:3px; height:13px; border-radius:2px;}
  .goalname{font-size:12px; font-weight:700;}
  .meter{display:flex; gap:4px; justify-content:center; margin-top:14px;}
  .seg{width:26px; height:6px; border-radius:3px; background:var(--line-soft);}
  .seg.done{background:rgba(196,143,191,.45);}

  .controls{margin-top:auto; margin-bottom:48px; display:flex; flex-direction:column; align-items:center; gap:22px;}
  .fab{width:76px; height:76px; border-radius:999px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:var(--ember); border:1px solid rgba(255,178,94,.34); box-shadow:0 10px 30px rgba(240,138,62,.30); transition:background .2s var(--ease), transform .2s var(--ease);}
  .fab:hover{background:var(--ember-hi); transform:translateY(-1px);}
  .end{font-size:14px; font-weight:700; color:var(--t3); cursor:pointer;}
  .end:hover{color:var(--t2);}
  .hint{position:absolute; bottom:20px; left:0; right:0; text-align:center; font-size:11px; font-weight:600; letter-spacing:.05px; color:var(--t5); z-index:1;}
</style>
</head>
<body>
  <div class="frame">
    <div class="stage">

      <div class="topbar">
        <div class="chev" aria-label="Close focus">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 3.5 L5 8 L9.5 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="phase">
          <div class="paused-chip">
            <span class="paused-dot"></span>
            <span class="overline paused-txt">Paused</span>
          </div>
          <span class="phase-sub">Block 3 of 3</span>
        </div>
        <div class="spacer"></div>
      </div>

      <div class="ring-wrap">
        <svg class="ring" width="312" height="312" viewBox="0 0 312 312">
          <!-- remaining arc: dashed hairline -->
          <circle cx="156" cy="156" r="146" fill="none" stroke="#1A1D23" stroke-width="2"
            stroke-dasharray="3 8"/>
          <!-- elapsed progress: desaturated, static, no glow. C = 917.3 -->
          <circle cx="156" cy="156" r="146" fill="none" stroke="#7C5638" stroke-width="8"
            stroke-linecap="round" stroke-dasharray="917.3" stroke-dashoffset="495.4"/>
        </svg>
        <div class="center">
          <div class="time">13:24</div>
          <div class="overline time-sub">Paused</div>
        </div>
      </div>

      <div class="task">
        <div class="task-title">ESP8266 firmware polling</div>
        <div class="goalmark">
          <span class="tick" style="background:#C48FBF"></span>
          <span class="goalname" style="color:#C48FBF">Robotics Mission</span>
        </div>
        <div class="meter">
          <span class="seg done"></span>
          <span class="seg done"></span>
          <span class="seg"></span>
        </div>
      </div>

    </div>

    <div class="controls">
      <div class="fab" aria-label="Resume timer">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path d="M7 4 L19 12 L7 20 Z" fill="#0E0F12"/>
        </svg>
      </div>
      <div class="end">End session — minutes are kept</div>
    </div>

    <!-- Conditional: shown ONLY when an Ekagra Desk device is paired & connected -->
    <div class="hint">Paused · desk light dimmed</div>
  </div>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Focus · Sunlit Slate</title><style>
:root{--bg:#F3F5F7;--surface:#E7EBEF;--ink:#232B33;--muted:#5D6872;--line:#D3D9DE;--accent:#C24717;--success:#1F7A64}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#d9dde0;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:var(--bg);border:8px solid #30363b;border-radius:30px;overflow:hidden;box-shadow:0 24px 70px rgba(35,43,51,.23)}.focus{height:100%;padding:26px 28px 18px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.brand{font:600 18px Georgia,serif;letter-spacing:-.04em}.sync{display:flex;gap:7px;align-items:center;font:800 9px ui-monospace,monospace;letter-spacing:.15em;color:var(--muted)}.sync i{width:8px;height:8px;border:1px solid var(--success);display:block}.hero{text-align:center;margin-top:72px}.kicker{font:800 10px ui-monospace,monospace;letter-spacing:.3em;color:var(--muted)}.timer{font:500 90px/1 ui-monospace,monospace;letter-spacing:-.08em;margin:16px -10px 0}.live{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:12px;font:800 10px ui-monospace,monospace;letter-spacing:.16em}.live i{width:7px;height:7px;background:var(--success);display:block}.task{font-size:20px;font-weight:750;margin-top:52px}.context{font-size:11px;color:var(--muted);margin-top:6px}.bar{height:4px;width:280px;background:#d0d7dd;margin:15px auto 0;overflow:hidden}.bar i{display:block;height:100%;width:58%;background:var(--ink)}.pips{display:flex;justify-content:center;gap:7px;margin-top:24px}.pip{width:11px;height:11px;border:1.5px solid #aeb7bf;border-radius:2px}.pip.done{background:var(--ink);border-color:var(--ink)}.pip.current{background:var(--accent);border-color:var(--accent)}.stats{display:flex;justify-content:center;margin-top:34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0}.stat{width:33.333%;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat b{display:block;font:600 16px ui-monospace,monospace}.stat span{display:block;font-size:9px;letter-spacing:.12em;color:var(--muted);margin-top:4px}.extend{display:flex;justify-content:center;gap:7px;margin-top:23px}.extend button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:7px 11px;font-size:11px;font-weight:800}.transport{margin-top:auto;display:flex;justify-content:center;align-items:center;gap:23px}.transport button{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:800;display:flex;flex-direction:column;gap:7px;align-items:center}.transport button span{font-size:17px;color:var(--ink)}.play{width:72px;height:72px;border-radius:16px!important;background:var(--accent)!important;color:var(--bg)!important;box-shadow:0 5px 16px rgba(194,71,23,.34)}.play span{color:var(--bg)!important;font-size:22px!important}.gesture{height:4px;width:105px;background:var(--ink);margin:20px auto 0}@media(max-width:430px){body{padding:0}.phone{border:0;border-radius:0}}
</style></head><body><main class="phone"><section class="focus"><header class="top"><div class="brand">ekagra</div><div class="sync"><i></i>DESK SYNC</div></header><div class="hero" data-motion="task-focus-morph"><div class="kicker">FOCUS</div><div class="timer" aria-label="18 minutes 42 seconds remaining">18:42</div><div class="live"><i></i>LIVE</div><div class="task">MAD2 Celery jobs</div><div class="context">DEEP · Student · SESSION 4 / 6</div><div class="bar"><i></i></div><div class="pips"><i class="pip done"></i><i class="pip done"></i><i class="pip done"></i><i class="pip current"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div><div class="stats"><div class="stat"><b>3:10</b><span>TODAY</span></div><div class="stat"><b>04</b><span>SESSIONS</span></div><div class="stat"><b>05</b><span>STREAK</span></div></div><div class="extend"><button>+1 MIN</button><button>+5 MIN</button></div></div><div class="transport"><button aria-label="Reset session"><span>↺</span>Reset</button><button class="play" aria-label="Pause session"><span>Ⅱ</span>Pause</button><button aria-label="Skip session"><span>≫</span>Skip</button></div><div class="gesture"></div></section></main></body></html>

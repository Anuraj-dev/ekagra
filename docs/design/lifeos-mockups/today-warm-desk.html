    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#d8d0c3;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;overflow:hidden;position:relative;background:var(--bg);border:8px solid #29231f;border-radius:39px;box-shadow:0 24px 70px rgba(41,35,31,.28)}.screen{height:100%;padding:24px 18px 0;position:relative}.top{display:flex;align-items:flex-start;justify-content:space-between}.wordmark{font:600 22px Georgia,serif;letter-spacing:-.04em}.date{text-align:right;font-size:10px;letter-spacing:.13em;font-weight:700;color:var(--muted);line-height:1.45}.title-row{display:flex;align-items:end;justify-content:space-between;margin-top:20px}.eyebrow{font-size:10px;letter-spacing:.2em;font-weight:800;color:var(--muted)}h1{font:600 33px/1 Georgia,serif;letter-spacing:-.05em;margin:4px 0 0}.ring{width:43px;height:43px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font:600 11px ui-monospace,monospace;color:var(--muted)}.identities{display:flex;gap:7px;margin-top:19px}.identity{padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;color:var(--muted)}.identity.active{color:var(--bg);background:var(--ink);border-color:var(--ink)}.rule{height:1px;background:var(--line);margin:19px 0 13px}.section-head{display:flex;justify-content:space-between;align-items:center}.kicker{font-size:10px;letter-spacing:.18em;font-weight:800;color:var(--muted)}.count{font:600 12px ui-monospace,monospace;color:var(--muted)}.timeline{margin-top:10px}.block{display:grid;grid-template-columns:43px 1fr;gap:10px;position:relative}.time{font:600 10px ui-monospace,monospace;color:var(--muted);padding-top:13px}.block:before{content:"";position:absolute;left:49px;top:0;bottom:-10px;border-left:1px solid var(--line)}.block:last-child:before{bottom:28px}.block-dot{position:absolute;left:44px;top:15px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);background:var(--line);box-shadow:0 0 0 1px var(--line)}.block.active .block-dot{background:var(--accent);box-shadow:0 0 0 1px var(--accent)}.block-card{margin-left:10px;margin-bottom:10px;border:1px solid var(--line);border-radius:18px;background:rgba(243,237,226,.48);padding:12px 12px 11px;position:relative}.block.active .block-card{background:var(--surface);border-color:var(--ink);box-shadow:var(--shadow)}.block-top{display:flex;justify-content:space-between;align-items:center}.kind{font-size:9px;letter-spacing:.18em;font-weight:800;color:var(--muted)}.duration{font:600 11px ui-monospace,monospace;color:var(--muted)}.task{font:600 16px Georgia,serif;margin-top:7px}.goal{font-size:11px;color:var(--muted);margin-top:3px}.meter{height:5px;border-radius:99px;background:#e2d8c9;margin-top:11px;overflow:hidden}.meter i{display:block;height:100%;width:58%;background:var(--accent);border-radius:99px}.block-actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.state{font-size:10px;letter-spacing:.08em;color:var(--accent);font-weight:800}.play{width:34px;height:34px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-size:12px}.shallow .block-card{padding-block:10px}.shallow .task{font-family:inherit;font-size:13px}.rest .block-card{background:transparent;border-style:dashed}.rest .task{font-family:inherit;font-size:13px;color:var(--muted)}.habits{margin:8px 0 0 53px;border-top:1px solid var(--line);padding-top:12px}.habit-row{display:flex;justify-content:space-between;align-items:center}.habit-row span{font-size:11px;font-weight:700}.checks{display:flex;gap:8px;margin-top:10px}.check{width:48px;height:36px;border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;position:relative}.check.done{background:var(--success);border-color:var(--success);color:var(--bg)}.check.done:after{content:"✓";font-size:16px}.check.next:after{content:"";width:8px;height:8px;border:1px solid var(--success);border-radius:50%}.check small{position:absolute;top:39px;font-size:9px;color:var(--muted);white-space:nowrap}.chain{height:5px;display:flex;gap:3px;margin-top:13px}.chain i{height:100%;flex:1;border-radius:99px;background:var(--line)}.chain i.on{background:var(--success)}.floating{position:absolute;left:18px;right:18px;bottom:76px;display:flex;justify-content:space-between;align-items:center}.overdue{display:flex;gap:7px;align-items:center;border:1px solid var(--danger);border-radius:999px;padding:8px 10px;background:var(--bg);color:var(--danger);font-size:11px;font-weight:800}.sweep{border:0;background:none;color:var(--danger);font:800 10px inherit;letter-spacing:.08em}.timer{display:flex;gap:9px;align-items:center;background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 12px;box-shadow:0 3px 10px rgba(43,38,33,.25);font-size:11px}.live{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(103,83,199,.18)}.timer b{font:600 12px ui-monospace,monospace}.mic{position:absolute;right:18px;bottom:78px;width:46px;height:46px;border:1px solid var(--accent);border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;box-shadow:0 5px 15px rgba(103,83,199,.28)}svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav{position:absolute;bottom:0;left:0;right:0;height:61px;border-top:1px solid var(--line);background:rgba(243,237,226,.92);display:flex;align-items:center;justify-content:space-around;padding:7px 10px 8px}.nav a{font-size:10px;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;gap:3px;align-items:center}.nav a.active{color:var(--ink);font-weight:800}.nav a.active:before{content:"";height:3px;width:24px;border-radius:99px;background:var(--accent);margin-bottom:1px}

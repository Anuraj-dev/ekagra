<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Focus · Warm Desk</title><style>
:root{--bg:#FBF7F0;--surface:#F3EDE2;--ink:#2B2621;--muted:#6d6258;--line:#dfd5c6;--accent:#6753C7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#d8d0c3;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;overflow:hidden;background:var(--bg);border:8px solid #29231f;border-radius:39px;box-shadow:0 24px 70px rgba(41,35,31,.28)}.focus{height:100%;padding:28px 28px 18px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.brand{font:600 18px Georgia,serif;letter-spacing:-.04em;color:var(--muted)}.sync{font-size:10px;letter-spacing:.14em;color:var(--muted);display:flex;gap:7px;align-items:center}.sync i{width:8px;height:8px;border:1px solid var(--accent);border-radius:50%;display:block}.hero{text-align:center;margin-top:74px}.kicker{font-size:10px;letter-spacing:.3em;font-weight:800;color:var(--muted)}.timer{font:500 90px/1 ui-monospace,SFMono-Regular,monospace;letter-spacing:-.08em;margin:16px -10px 0}.live{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:12px;font-size:11px;letter-spacing:.15em;font-weight:800}.live i{width:7px;height:7px;background:var(--accent);border-radius:50%;box-shadow:0 0 0 4px rgba(103,83,199,.14)}.task{font:600 20px Georgia,serif;margin-top:52px}.context{font-size:11px;color:var(--muted);margin-top:6px}.bar{height:4px;background:#e2d8c9;margin:15px auto 0;width:280px;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:58%;background:var(--ink);border-radius:99px}.pips{display:flex;justify-content:center;gap:7px;margin-top:24px}.pip{width:11px;height:11px;border:1.5px solid #c9bda8;border-radius:3px}.pip.done{background:var(--ink);border-color:var(--ink)}.pip.current{background:var(--accent);border-color:var(--accent)}.stats{display:flex;justify-content:center;margin-top:34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0}.stat{width:33.333%;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat b{display:block;font:600 16px ui-monospace,monospace}.stat span{display:block;font-size:9px;letter-spacing:.13em;color:var(--muted);margin-top:4px}.extend{display:flex;justify-content:center;gap:7px;margin-top:23px}.extend button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700}.transport{margin-top:auto;display:flex;justify-content:center;align-items:center;gap:23px}.transport button{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;gap:7px;align-items:center}.transport button span{font-size:17px;color:var(--ink)}.play{width:72px;height:72px;border-radius:26px!important;background:var(--accent)!important;color:var(--bg)!important;box-shadow:0 5px 16px rgba(103,83,199,.4)}.play span{color:var(--bg)!important;font-size:22px!important}.gesture{height:4px;width:105px;border-radius:99px;background:var(--ink);opacity:.85;margin:20px auto 0}@media(max-width:430px){body{padding:0}.phone{border:0;border-radius:0}}
</style></head><body><main class="phone"><section class="focus"><header class="top"><div class="brand">ekagra</div><div class="sync"><i></i>DESK SYNC</div></header><div class="hero" data-motion="task-focus-morph"><div class="kicker">FOCUS</div><div class="timer" aria-label="18 minutes 42 seconds remaining">18:42</div><div class="live"><i></i>LIVE</div><div class="task">MAD2 Celery jobs</div><div class="context">DEEP · Student · SESSION 4 / 6</div><div class="bar"><i></i></div><div class="pips" aria-label="Session progress"><i class="pip done"></i><i class="pip done"></i><i class="pip done"></i><i class="pip current"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div><div class="stats"><div class="stat"><b>3:10</b><span>TODAY</span></div><div class="stat"><b>04</b><span>SESSIONS</span></div><div class="stat"><b>05</b><span>STREAK</span></div></div><div class="extend"><button>+1 MIN</button><button>+5 MIN</button></div></div><div class="transport"><button aria-label="Reset session"><span>↺</span>Reset</button><button class="play" aria-label="Pause session"><span>Ⅱ</span>Pause</button><button aria-label="Skip session"><span>≫</span>Skip</button></div><div class="gesture"></div></section></main></body></html>

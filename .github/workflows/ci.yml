name: CI

on:
  pull_request:
  push:
    branches: [main, phase-0-scaffold, phase-1-timer-engine, phase-2-api]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Core vendor copy is in sync
        run: |
          ./scripts/sync-core-vendor.sh
          git diff --exit-code supabase/functions/_vendor
      - run: bun run lint
      - run: bun run test

  supabase:
    name: Fresh Supabase migrations and database tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: bun install --frozen-lockfile
      - run: supabase start -x studio -x imgproxy
      - run: supabase db lint --local
      - run: supabase db reset --local
      - name: Run database tests
        run: |
          # Every test except the identities upgrade replay, which downgrades the
          # schema and must not run before tests that assume the intact one.
          # Globbing (not a hand-written list) keeps new tests in this suite.
          mapfile -t suite < <(
            find supabase/tests -maxdepth 1 -name '*.sql' \
              ! -name 'life_os_identities_upgrade.sql' \
              ! -name 'life_os_plans_commitments_upgrade.sql' | sort
          )
          supabase test db "${suite[@]}"
      - name: Export local Supabase connection values
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Start Edge Functions
        run: |
          setsid nohup supabase functions serve > /tmp/ekagra-functions.log 2>&1 &
          sleep 5
      - name: Wait for Edge Functions
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:54321/functions/v1/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ekagra-functions.log
          exit 1
      - run: bun scripts/phase-2-smoke.ts
      - run: bun scripts/phase-8-cli-smoke.ts
      - name: Replay the plans and commitments upgrade
        run: |
          supabase db reset --local --version 20260731010000
          migration_fixture=supabase/tests/life_os_plans_commitments_migration.inc
          cp supabase/migrations/20260731020000_life_os_plans_commitments.sql "$migration_fixture"
          trap 'rm -f "$migration_fixture"' EXIT
          supabase test db supabase/tests/life_os_plans_commitments_upgrade.sql
      # Strictly the last database test. Reset to the migration immediately
      # before identities, then replay the identities migration against that
      # disposable schema. Pinning the starting version keeps later Identity
      # foreign keys from making this historical upgrade test impossible.
      - name: Replay the identities upgrade
        run: |
          supabase db reset --local --version 20260713170000
          migration_fixture=supabase/tests/life_os_identities_migration.inc
          # The replay \ir's this fixture, so the copy has to live inside the
          # test directory the CLI mounts, under its exact expected name.
          cp supabase/migrations/20260731010000_life_os_identities.sql "$migration_fixture"
          trap 'rm -f "$migration_fixture"' EXIT
          supabase test db supabase/tests/life_os_identities_upgrade.sql
      - name: Dump edge function logs
        if: failure()
        run: |
          cat /tmp/ekagra-functions.log || true
          docker ps -a --format "{{.Names}}" | grep edge | xargs -r -n1 docker logs --tail 100
      - if: always()
        run: supabase stop

  # Browser/Docker E2E is intentionally absent until a UI exists. When added,
  # it belongs in this CI-only job family and is never part of local `bun test`.

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Focus · Graphite Studio</title><style>
:root{--bg:#101012;--surface:#17181B;--ink:#EDEDEF;--muted:#AEB0B8;--line:#303138;--accent:#6E76F0}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#292a2f;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:var(--bg);border:7px solid #050506;border-radius:28px;overflow:hidden;box-shadow:0 28px 80px rgba(0,0,0,.5)}.focus{height:100%;padding:25px 27px 16px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.brand{font:600 17px Georgia,serif;color:var(--muted)}.sync{display:flex;align-items:center;gap:7px;font:600 9px ui-monospace,monospace;letter-spacing:.16em;color:var(--muted)}.sync i{width:8px;height:8px;border:1px solid var(--accent);display:block}.hero{text-align:center;margin-top:70px}.kicker{font:700 9px ui-monospace,monospace;letter-spacing:.31em;color:var(--muted)}.timer{font:500 88px/1 ui-monospace,monospace;letter-spacing:-.08em;margin:15px -7px 0}.live{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:13px;font:700 10px ui-monospace,monospace;letter-spacing:.17em}.live i{width:6px;height:6px;background:var(--accent);display:block}.task{font-size:20px;font-weight:700;margin-top:51px}.context{font:11px ui-monospace,monospace;color:var(--muted);margin-top:7px}.bar{height:3px;width:280px;background:#2a2b31;margin:16px auto 0}.bar i{display:block;height:100%;width:58%;background:var(--ink)}.pips{display:flex;justify-content:center;gap:7px;margin-top:24px}.pip{width:11px;height:11px;border:1px solid #454750}.pip.done{background:var(--ink);border-color:var(--ink)}.pip.current{background:var(--accent);border-color:var(--accent)}.stats{display:flex;justify-content:center;margin-top:35px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0}.stat{width:33.333%;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat b{display:block;font:600 16px ui-monospace,monospace}.stat span{display:block;font:9px ui-monospace,monospace;letter-spacing:.12em;color:var(--muted);margin-top:4px}.extend{display:flex;justify-content:center;gap:7px;margin-top:22px}.extend button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 10px;font:600 10px ui-monospace,monospace}.transport{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:22px}.transport button{border:0;background:transparent;color:var(--muted);font:600 10px ui-monospace,monospace;display:flex;flex-direction:column;align-items:center;gap:7px}.transport button span{font-size:17px;color:var(--ink)}.play{width:72px;height:72px;background:var(--accent)!important;color:var(--bg)!important}.play span{color:var(--bg)!important;font-size:21px!important}.gesture{width:105px;height:3px;background:var(--ink);margin:20px auto 0}@media(max-width:430px){body{padding:0}.phone{border:0;border-radius:0}}
</style></head><body><main class="phone"><section class="focus"><header class="top"><div class="brand">ekagra</div><div class="sync"><i></i>DESK SYNC</div></header><div class="hero" data-motion="task-focus-morph"><div class="kicker">FOCUS</div><div class="timer" aria-label="18 minutes 42 seconds remaining">18:42</div><div class="live"><i></i>LIVE</div><div class="task">MAD2 Celery jobs</div><div class="context">DEEP · Student · SESSION 4 / 6</div><div class="bar"><i></i></div><div class="pips"><i class="pip done"></i><i class="pip done"></i><i class="pip done"></i><i class="pip current"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i></div><div class="stats"><div class="stat"><b>3:10</b><span>TODAY</span></div><div class="stat"><b>04</b><span>SESSIONS</span></div><div class="stat"><b>05</b><span>STREAK</span></div></div><div class="extend"><button>+1 MIN</button><button>+5 MIN</button></div></div><div class="transport"><button aria-label="Reset session"><span>↺</span>Reset</button><button class="play" aria-label="Pause session"><span>Ⅱ</span>Pause</button><button aria-label="Skip session"><span>≫</span>Skip</button></div><div class="gesture"></div></section></main></body></html>

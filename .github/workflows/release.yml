name: Release APK

# Publishing a new Android build (modeled on pomo's release pipeline): every
# push to main builds the release APK for the version currently declared in
# apps/mobile/app.config.ts. If that version has already been published the
# run exits early, so shipping a new build = bump `version` in app.config.ts
# and merge. The APK and its .sha256 go to the public `app-releases` Supabase
# Storage bucket (the repo is private, so phones cannot fetch GitHub release
# assets), a row lands in `app_releases` for the in-app updater, and both
# files are archived on a GitHub Release.
#
# CRITICAL: the APK is signed with ONE stable debug keystore stored in the
# DEBUG_KEYSTORE_BASE64 secret. The job fails hard when it is missing — an
# ephemeral per-run key would make phones reject every in-place update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from app.config.ts
        id: version
        run: |
          set -euo pipefail
          version=$(grep -oE "version: '[^']+'" apps/mobile/app.config.ts | head -n1 | sed -E "s/version: '([^']+)'/\1/")
          if [ -z "$version" ]; then
            echo "Could not read version from apps/mobile/app.config.ts" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version $version"

      - name: Skip if this version is already released
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          existing=$(curl --fail --show-error --silent \
            "${SUPABASE_URL}/rest/v1/app_releases?select=id&platform=eq.android&version=eq.${VERSION}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}")
          if [ "$existing" != "[]" ]; then
            echo "Version ${VERSION} already published; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.skip == 'false'
        with:
          bun-version: 1.3.14

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: steps.gate.outputs.skip == 'false'

      - run: bun install --frozen-lockfile
        if: steps.gate.outputs.skip == 'false'

      - name: Prebuild Android project
        if: steps.gate.outputs.skip == 'false'
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo prebuild -p android --no-install

      - name: Install stable signing keystore
        if: steps.gate.outputs.skip == 'false'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "DEBUG_KEYSTORE_BASE64 secret is not set. Releases would be" \
                 "signed with an ephemeral key and break in-place updates." >&2
            exit 1
          fi
          # Expo's prebuilt Gradle project signs both debug and release build
          # types with android/app/debug.keystore; overwrite the generated one
          # (and the SDK default location) with our stable key.
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/debug.keystore
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Assemble release APK
        if: steps.gate.outputs.skip == 'false'
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: ./android/gradlew -p android assembleRelease

      - name: Collect artifacts
        if: steps.gate.outputs.skip == 'false'
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          built=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$built" ]; then
            echo "No release APK found" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          apk="release-artifacts/ekagra-${VERSION}.apk"
          cp "$built" "$apk"
          (cd release-artifacts && sha256sum "ekagra-${VERSION}.apk" > "ekagra-${VERSION}.apk.sha256")
          sha256=$(cut -d' ' -f1 "release-artifacts/ekagra-${VERSION}.apk.sha256")
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "sha_path=$apk.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload APK and checksum to Supabase Storage
        if: steps.gate.outputs.skip == 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          SHA_PATH: ${{ steps.apk.outputs.sha_path }}
        run: |
          set -euo pipefail
          upload() {
            curl --fail --show-error --silent \
              -X POST "${SUPABASE_URL}/storage/v1/object/app-releases/android/$1" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "x-upsert: true" \
              -H "Content-Type: $2" \
              --data-binary "@$3"
            echo
          }
          upload "ekagra-${VERSION}.apk" "application/vnd.android.package-archive" "$APK_PATH"
          upload "ekagra-${VERSION}.apk.sha256" "text/plain" "$SHA_PATH"

      - name: Record release row
        if: steps.gate.outputs.skip == 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          apk_url="${SUPABASE_URL}/storage/v1/object/public/app-releases/android/ekagra-${VERSION}.apk"
          jq -n \
            --arg platform "android" \
            --arg version "$VERSION" \
            --arg apk_url "$apk_url" \
            --arg sha256 "$SHA256" \
            --arg notes "${NOTES:-}" \
            '{platform: $platform, version: $version, apk_url: $apk_url, sha256: $sha256, notes: $notes}' \
          | curl --fail --show-error --silent \
              -X POST "${SUPABASE_URL}/rest/v1/app_releases" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates" \
              --data-binary @-

      - name: Archive on GitHub Release
        if: steps.gate.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ekagra ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.sha_path }}
          fail_on_unmatched_files: true

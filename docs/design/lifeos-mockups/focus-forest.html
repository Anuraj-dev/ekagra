<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Focus · Forest Ledger</title><style>
:root{--bg:#F4F1E8;--surface:#E9E4D4;--ink:#232A22;--muted:#5F695E;--line:#D4CFBE;--accent:#A85423;--success:#2F7A45}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#cfd2c5;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:var(--bg);border:8px solid #283027;border-radius:42px;overflow:hidden;box-shadow:0 26px 72px rgba(35,42,34,.25)}.focus{height:100%;padding:28px 28px 18px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.brand{font:600 18px Georgia,serif;letter-spacing:-.04em}.sync{display:flex;gap:7px;align-items:center;font-size:9px;letter-spacing:.16em;font-weight:800;color:var(--muted)}.sync i{width:8px;height:8px;border:1px solid var(--success);border-radius:50%;display:block}.hero{text-align:center;margin-top:73px}.kicker{font-size:10px;letter-spacing:.3em;font-weight:800;color:var(--muted)}.timer{font:500 90px/1 ui-monospace,monospace;letter-spacing:-.08em;margin:16px -10px 0}.live{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:12px;font-size:10px;letter-spacing:.17em;font-weight:800}.live i{width:7px;height:7px;background:var(--success);border-radius:50%;box-shadow:0 0 0 4px rgba(47,122,69,.14)}.task{font:600 20px Georgia,serif;margin-top:52px}.context{font-size:11px;color:var(--muted);margin-top:6px}.bar{height:5px;width:280px;background:#d8d3c2;border-radius:99px;margin:15px auto 0;overflow:hidden}.bar i{display:block;height:100%;width:58%;background:var(--accent);border-radius:99px}.pips{display:flex;justify-content:center;gap:7px;margin-top:24px}.pip{width:11px;height:11px;border:1.5px solid #c1b9a5;border-radius:50%}.pip.done{background:var(--success);border-color:var(--success)}.pip.current{background:var(--accent);border-color:var(--accent)}.stats{display:flex;justify-content:center;margin-top:34px;border-top:1px solid
